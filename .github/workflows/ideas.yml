name: Ideas a video (Gemini, opcional)

# Se activa al guardar contenido/pedido.txt. Convierte cada idea en un concepto de video (contenido/conceptos).
on:
  push:
    paths: ["contenido/pedido.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ideas:
    runs-on: ubuntu-24.04   # fijo: probado así (ubuntu-latest cambia de versión)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests==2.32.3
      - name: Convertir ideas en conceptos
        working-directory: scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python ideas_gemini.py
      - name: Guardar
        run: |
          git config user.name "rebajon-bot"
          git config user.email "bot@users.noreply.github.com"
          git add contenido
          git diff --cached --quiet || (git commit -m "Conceptos nuevos desde pedido.txt" && git pull --rebase -q && git push)
