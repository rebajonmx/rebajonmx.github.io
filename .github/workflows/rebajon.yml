name: Rebajón MX automático

# Corre solo 2 veces al día (6 durante una campaña, ver config/marca.json → publicaciones_extra_en_campana).
# También se puede correr a mano: pestaña Actions → "Rebajón MX automático" → Run workflow.
on:
  schedule:
    - cron: "0 13 * * *"   # 7:00 a. m. Ciudad de México
    - cron: "0 16 * * *"   # 10:00 a. m. Ciudad de México (solo durante campaña)
    - cron: "0 18 * * *"   # 12:00 p. m. Ciudad de México (solo durante campaña)
    - cron: "0 21 * * *"   # 3:00 p. m. Ciudad de México (solo durante campaña)
    - cron: "0 23 * * *"   # 5:00 p. m. Ciudad de México (solo durante campaña)
    - cron: "0 1 * * *"    # 7:00 p. m. Ciudad de México
  workflow_dispatch:
    inputs:
      concepto:
        description: "Concepto a usar (nombre del archivo en contenido/conceptos, sin .json). Vacío = automático"
        required: false
      tema:
        description: "Color: azul, blanco o rosa. Vacío = automático"
        required: false
      publicar:
        description: "¿Publicar en redes? (desmarca para solo probar)"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: rebajon
  cancel-in-progress: false

jobs:
  turno:
    # Decide si este horario toca: los horarios extra solo corren durante la campaña.
    runs-on: ubuntu-24.04   # fijo: probado así (ubuntu-latest cambia de versión)
    outputs:
      seguir: ${{ steps.r.outputs.seguir }}
    steps:
      - uses: actions/checkout@v4
      - id: r
        working-directory: scripts
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          from comun import CONFIG, campana
          extra = "${{ github.event.schedule }}" in ("0 16 * * *", "0 18 * * *", "0 21 * * *", "0 23 * * *")
          seguir = (not extra) or (CONFIG.get("publicaciones_extra_en_campana", True) and campana()["etapa"] == "durante")
          print("seguir=" + ("true" if seguir else "false"))
          PY
          cat "$GITHUB_OUTPUT"

  ciclo:
    needs: turno
    if: needs.turno.outputs.seguir == 'true'
    runs-on: ubuntu-24.04   # fijo: probado así (ubuntu-latest cambia de versión)
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar herramientas
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-noto-color-emoji
          pip install -q requests==2.32.3 playwright==1.48.0 num2words==0.5.14
          python -m playwright install --with-deps chromium

      - uses: actions/cache@v4
        with:
          path: ~/piper
          key: piper-2023.11.14-2-esmx-ald-v2

      - name: Instalar voz de Rebi (Piper, gratis y libre)
        continue-on-error: true
        run: |
          mkdir -p ~/piper && cd ~/piper
          [ -x piper/piper ] || curl -sSLf https://github.com/rhasspy/piper/releases/download/2023.11.14-2/piper_linux_x86_64.tar.gz | tar xz
          for v in es/es_MX/ald/medium/es_MX-ald-medium es/es_MX/claude/high/es_MX-claude-high; do   # ald = voz masculina
            n=$(basename $v)
            if [ ! -s $n.onnx ]; then
              curl -sSLf -o $n.onnx https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/$v.onnx && \
              curl -sSLf -o $n.onnx.json https://huggingface.co/rhasspy/piper-voices/resolve/v1.0.0/$v.onnx.json || rm -f $n.onnx*
            fi
            [ -s $n.onnx ] && break
          done
          M=$(ls ~/piper/es_MX-ald-medium.onnx ~/piper/*.onnx 2>/dev/null | head -1)
          echo "PIPER_BIN=$HOME/piper/piper/piper" >> "$GITHUB_ENV"
          echo "PIPER_MODEL=$M" >> "$GITHUB_ENV"
          echo "Hola, soy Rebi" | ~/piper/piper/piper --model "$M" --output_file /tmp/prueba.wav && ls -la /tmp/prueba.wav

      - name: 1. Ofertas (links.txt + API de Mercado Libre)
        working-directory: scripts
        env:
          ML_CLIENT_ID: ${{ secrets.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
        run: python actualizar_ofertas.py

      - name: 2. Construir página
        working-directory: scripts
        run: python construir_sitio.py

      - name: 3. Crear video del turno
        working-directory: scripts
        run: python generar_video.py --concepto "${{ github.event.inputs.concepto }}" --tema "${{ github.event.inputs.tema }}"

      - name: 3b. Crear carrusel de imágenes del día
        continue-on-error: true
        working-directory: scripts
        run: python generar_carrusel.py

      - name: 4. Publicar página en Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx -y netlify-cli@17.38.1 deploy --prod --dir public --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" --message "Actualización automática"

      - name: 5. Publicar en Instagram, Facebook y TikTok (Buffer)
        id: buffer
        if: github.event_name == 'schedule' || github.event.inputs.publicar == 'true'
        working-directory: scripts
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: sleep 20 && python publicar_buffer.py

      - name: 5b. Publicar carrusel (1 al día, desde las 11:00)
        if: github.event_name == 'schedule' || github.event.inputs.publicar == 'true'
        continue-on-error: true
        working-directory: scripts
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
        run: python publicar_buffer.py --carrusel

      - name: 6. Publicar en Telegram (opcional)
        if: github.event_name == 'schedule' || github.event.inputs.publicar == 'true'
        continue-on-error: true
        working-directory: scripts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python publicar_telegram.py

      - name: 7. Auditoría (escribe ESTADO.md)
        if: always()
        working-directory: scripts
        run: sleep 15 && python auditar.py "${{ steps.buffer.outcome }}"

      - name: 8. Guardar registro
        if: always()
        run: |
          git config user.name "rebajon-bot"
          git config user.email "bot@users.noreply.github.com"
          for f in data/ofertas.json data/historial.json data/pendientes.json ESTADO.md; do [ -f "$f" ] && git add "$f"; done
          git diff --cached --quiet || (git commit -m "Registro $(date -u +%F\ %H:%M)" && git pull --rebase -q && git push)

      - name: Guardar video (descargable 7 días)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.run_number }}
          path: |
            public/media/*.mp4
            public/media/carrusel-*.jpg
            public/media/turno.json
            public/whatsapp.txt
          retention-days: 7
