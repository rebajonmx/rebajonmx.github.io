name: Redirigir página vieja (Netlify → GitHub)

# La página se mudó de rebajonmx.netlify.app a rebajonmx.github.io el 12-nov-2026 (Netlify se quedó sin créditos).
# Las publicaciones viejas tienen el link de Netlify. Este flujo convierte la página vieja en un desvío automático
# a la nueva. Netlify bloquea publicar hasta que se renueven los créditos (9 dic 2026), así que lo intenta 1 vez al día;
# cuando ya desvía, no hace nada (no gasta créditos). Se puede borrar este archivo cuando el desvío funcione.
on:
  schedule:
    - cron: "0 15 * * *"   # 9:00 a. m. Ciudad de México
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desvio:
    runs-on: ubuntu-24.04
    steps:
      - name: Revisar y publicar desvío
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: |
          if curl -sI https://rebajonmx.netlify.app/ | grep -qi "^location: https://rebajonmx.github.io"; then
            echo "La página vieja ya desvía a rebajonmx.github.io. Nada que hacer."; exit 0
          fi
          mkdir -p desvio
          printf '/*  https://rebajonmx.github.io/:splat  301!\n' > desvio/_redirects
          printf '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=https://rebajonmx.github.io/"><title>Rebajón MX</title><p>Nos mudamos: <a href="https://rebajonmx.github.io/">rebajonmx.github.io</a></p>\n' > desvio/index.html
          if npx -y netlify-cli@17.38.1 deploy --prod --dir desvio --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" --message "Desvío a GitHub Pages"; then
            echo "Desvío publicado."
          else
            echo "Netlify todavía no deja publicar (sin créditos hasta el 9 dic). Se intenta mañana."
          fi
